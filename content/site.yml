# 申请主线定位句。来源:corpus/bio-and-narrative.md「一句话定位」
tagline: >-
  Information retrieval and retrieval-augmented intelligent systems, with an
  emphasis on reliable knowledge access, evaluation, and scientific applications.

# 首页自我介绍。风格红线:句子不过分工整、少抽象名词、保留个人语气。
intro: |
  I work on how retrieval systems decide what counts as a good answer, and on
  whether we can tell when they get it wrong.

  At Brown I build and evaluate retrieval pipelines for climate science
  literature in Stephen Bach's group — where the hard part is evaluation, since
  nobody hands you relevance labels for a corpus of research papers. Separately,
  I audit where identity-related bias enters late-interaction retrieval scores,
  down to individual query tokens.

  Before graduate school I built agent systems in industry. That is where these
  questions first showed up: the retrieval and memory layer, not the model,
  decided whether the thing worked.

