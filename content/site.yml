# 搜索与分享摘要。与用户 2026-11-08 提供的 SoP 研究愿景保持一致。
tagline: >-
  Interpretable information retrieval: mechanisms, evaluation, and tools for knowledge discovery.

# 首页自我介绍。风格红线:句子不过分工整、少抽象名词、保留个人语气。
intro: |
  I want to help people turn abundant data into knowledge they can understand
  and use. My research focuses on information retrieval: how systems identify
  relevant evidence, what drives their rankings, and how to evaluate their
  behavior beyond aggregate performance scores. I aim to advance the foundations
  of interpretable retrieval while building tools that researchers, policymakers,
  and the public can use to investigate questions and make informed decisions.

