    <dc:title>Decoding layout A</dc:title>
    <dc:date>2026-11-08</dc:date>
    <dc:description>Figure 2(a), redrawn for a small web display. Linear decoding of layout A's source geometry under homeostatic reward: A-then-B QTM 0.9252854270779534 (n=11), B-only never exposed to A 0.9218954360684479 (n=15), untrained 0.4397528368881535 (n=11). Dots are all selected seed observations; whiskers are original 95% percentile-bootstrap confidence intervals. Episode counts are matched; interactions and updates are not. Similar scores do not prove equivalence or establish retained task-specific memory.</dc:description>
